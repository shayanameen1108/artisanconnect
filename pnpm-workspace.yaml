# `vp migrate` writes this so Vite and Vitest resolve to Vite+'s copies.
# Upgrade with `vp upgrade`, then `vp migrate`.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Their install scripts only check the platform binary each already ships.
allowBuilds:
  esbuild: false
  workerd: false
permissions:
  "@tanstack/react-start":
    skills: true
  "@tanstack/react-table":
    skills: true
patchedDependencies:
  void@1.2.1: patches/void@1.2.1.patch
